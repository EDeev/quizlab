name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    name: Образ ${{ matrix.part }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [backend, nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # один пакет quizlab, части API различаются тегами: backend-1.2.3 / backend, nginx-1.2.3 / nginx
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/edeev/quizlab
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.part }}-
            type=raw,value=${{ matrix.part }}
      - uses: docker/build-push-action@v6
        with:
          context: lab-2/local/${{ matrix.part }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
